theme: jekyll-theme-chirpy

lang: en
timezone: America/New_York

title: Juan Felipe Mendez-Valderrama
tagline: Theoretical condensed-matter physics
description: >-
  Theoretical condensed-matter physicist and PCCM postdoctoral fellow at
  Princeton University.
url: "https://mendezv.github.io"
baseurl: ""

github:
  username: MendezV

twitter:
  username:

social:
  name: Juan Felipe Mendez-Valderrama
  email:
  links:
    - https://github.com/MendezV
    - https://scholar.google.com/citations?user=u138FgQAAAAJ&hl=en
    - https://orcid.org/0000-0003-3026-8940

avatar: /assets/profile.jpg
social_preview_image: /assets/profile.jpg
theme_mode:
img_cdn:

toc: true

comments:
  provider:

google_analytics:
  id:
  pv:
    proxy_endpoint:
    cache_path:

assets:
  self_host:
    enabled: false

pwa:
  enabled: false

plugins:
  - jekyll-archives
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  footnote_backlink: "↩︎"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

permalink: /posts/:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - .DS_Store
  - docs
  - script
  - README.md
  - LICENSE
  - thumbnail.png
  - another-page.md
